upstream chesstutis {
    server app:8080;
    keepalive 16;
}

# HTTP: serve Certbot challenges and redirect everything else to HTTPS.
server {
    listen 80 default_server;
    server_name chesstutis.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://chesstutis.org$request_uri;
    }
}

# HTTPS application.
server {
    listen 443 ssl default_server;
    http2 on;

    server_name chesstutis.org;

    ssl_certificate /etc/letsencrypt/live/chesstutis.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chesstutis.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Keep this consistent with the application's request-body limit.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://chesstutis;
        proxy_http_version 1.1;

        # Enable upstream keep-alive.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
